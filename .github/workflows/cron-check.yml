name: 🔍 友链每日巡检

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: blog-automation-writes
  cancel-in-progress: false

jobs:
  check-friends:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check friend links
        env:
          FRIEND_ALERTS_PATH: ${{ runner.temp }}/friend-alert-events.json
        run: node scripts/friend-links/check.mjs

      - name: Commit changed status
        run: |
          if git diff --quiet -- public/friend-status.json; then
            echo "Friend status is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- public/friend-status.json
          git commit -m "friend-links: update health status"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Open or resolve threshold alerts
        uses: actions/github-script@v7
        env:
          FRIEND_ALERTS_PATH: ${{ runner.temp }}/friend-alert-events.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const events = JSON.parse(fs.readFileSync(process.env.FRIEND_ALERTS_PATH, 'utf8'));
            if (events.length === 0) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'friend-health';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'd73a4a',
                description: '友链连续巡检失败告警',
              });
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            for (const event of events) {
              const marker = `<!-- friend-health:${event.siteUrl} -->`;
              const existing = openIssues.find((issue) => issue.body?.includes(marker));
              if (event.type === 'alert' && !existing) {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: `[友链巡检] ${String(event.title).replace(/[\r\n]/g, ' ')}`,
                  labels: [label],
                  body: `${marker}\n友链 ${event.siteUrl} 已连续三次不可达或缺少反链，请人工确认。`,
                });
              }
              if (event.type === 'recovered' && existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: '✅ 最新巡检已恢复正常，自动关闭告警。',
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
            }
